// PanchangamData represents the Panchangam data for a specific date, including Tithi, Nakshatra, Yoga, Karana, sunrise time, sunset time, and any additional events.
// PanchangamEvent represents an event or special occurrence in the Panchangam, such as Rahu Kalam or Yamagandam.
// GetPanchangamRequest is the request message sent to the server to retrieve Panchangam data for a specific date.
//GetPanchangamResponse is the response message containing the requested Panchangam data.

syntax = "proto3";

package panchangam;

option go_package = "github.com/naren-m/panchangam/proto";

// Panchangam service definition
service Panchangam {
    // RPC method to retrieve Panchangam data for a specific date
    rpc Get(GetPanchangamRequest) returns (GetPanchangamResponse);

    // RPC method to retrieve current Tithi details for watch complications
    rpc GetTithiSummary(GetTithiSummaryRequest) returns (GetTithiSummaryResponse);
}

// Panchangam data for a specific date
message PanchangamData {
    // Date for which Panchangam data is provided (in ISO 8601 format: YYYY-MM-DD)
    string date = 1;

    // Tithi (lunar day) for the given date
    string tithi = 2;

    // Nakshatra (lunar mansion) for the given date
    string nakshatra = 3;

    // Yoga for the given date
    string yoga = 4;

    // Karana for the given date
    string karana = 5;

    // Sunrise time for the given date (in ISO 8601 format: HH:MM:SS)
    string sunrise_time = 6;

    // Sunset time for the given date (in ISO 8601 format: HH:MM:SS)
    string sunset_time = 7;

    // Additional Panchangam details or events for the given date
    repeated PanchangamEvent events = 8;

    // Timezone used for calculations (e.g., "Asia/Kolkata", "UTC+05:30")
    string timezone = 9;

    // Timezone offset from UTC (e.g., "+05:30", "-08:00")
    string timezone_offset = 10;

    // Whether daylight saving time is active
    bool is_dst = 11;
}

// Represents an event or special occurrence in the Panchangam
message PanchangamEvent {
    // Name or description of the event
    string name = 1;

    // Time of the event (in ISO 8601 format: HH:MM:SS)
    string time = 2;

    // Optional: Type of event (e.g., RAHU_KALAM, YAMAGANDAM, FESTIVAL)
    string event_type = 3;
}

// Request message to retrieve Panchangam data for a specific date
message GetPanchangamRequest {
    // Date for which Panchangam data is requested (in ISO 8601 format: YYYY-MM-DD)
    string date = 1;

    // Latitude of the location (required, -90 to 90)
    double latitude = 2;

    // Longitude of the location (required, -180 to 180)
    double longitude = 3;

    // Optional: Timezone identifier (e.g., "Asia/Kolkata")
    string timezone = 4;

    // Optional: Regional system (e.g., "Tamil Nadu", "Kerala")
    string region = 5;

    // Optional: Calculation method (e.g., "Drik", "Vakya")
    string calculation_method = 6;

    // Optional: Language/locale (e.g., "en", "ta")
    string locale = 7;
}

// Response message containing Panchangam data for the requested date
message GetPanchangamResponse {
    // Panchangam data for the requested date
    PanchangamData panchangam_data = 1;
}

// Request message to retrieve current Tithi details for a specific moment and location
message GetTithiSummaryRequest {
    // Moment to calculate in RFC3339 format
    string at = 1;

    // Latitude of the location (required, -90 to 90)
    double latitude = 2;

    // Longitude of the location (required, -180 to 180)
    double longitude = 3;

    // Timezone identifier (e.g., "America/Los_Angeles")
    string timezone = 4;

    // Regional system (e.g., "California", "Tamil Nadu")
    string region = 5;

    // Calculation method (e.g., "Drik")
    string calculation_method = 6;

    // Language/locale (e.g., "en")
    string locale = 7;

    // Optional calendar system override (e.g., "Purnimanta", "Amanta")
    string calendar_system = 8;
}

// Response message containing rich Tithi details for watch complications
message GetTithiSummaryResponse {
    // Local date for the calculation
    string date = 1;

    // Current Tithi details
    TithiSummary tithi = 2;

    // Other Pancha Anga details
    PanchaAngaSummary pancha_anga = 3;

    // Calculation settings used by the service
    TithiCalculationSummary calculation = 4;

    // Time this response was generated in RFC3339 format
    string generated_at = 5;

    // Best next refresh time in RFC3339 format
    string next_refresh_at = 6;

    // Day details used by the Mandala watch face
    DaySummary day = 7;
}

// Tithi details for compact mobile and watch display
message TithiSummary {
    string name = 1;
    string traditional_name = 2;
    int32 number = 3;
    string paksha = 4;
    int32 paksha_day = 5;
    string type = 6;
    string start_time = 7;
    string end_time = 8;
}

// Other Pancha Anga values for rich display
message PanchaAngaSummary {
    string nakshatra = 1;
    string yoga = 2;
    string karana = 3;
    string vara = 4;
}

// Day-level details for compact Mandala display
message DaySummary {
    // Local sunrise time in HH:MM format
    string sunrise_time = 1;

    // Local sunset time in HH:MM format
    string sunset_time = 2;

    // Abhijit Muhurta window for the local day
    TimeWindow abhijit_muhurta = 3;
}

// A named local time window for watch and phone display
message TimeWindow {
    string name = 1;
    string start_time = 2;
    string end_time = 3;
    bool auspicious = 4;
}

// Calculation metadata for diagnostics and display
message TithiCalculationSummary {
    string timezone = 1;
    string region = 2;
    string calendar_system = 3;
    string method = 4;
    string locale = 5;
}
