name: PanchangamWatch
options:
  bundleIdPrefix: com.naren
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PanchangamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PanchangamWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naren.panchangam.watch
        PRODUCT_NAME: PanchangamWatch
        INFOPLIST_FILE: PanchangamWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
  PanchangamWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PanchangamWatchTests
    dependencies:
      - target: PanchangamWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naren.panchangam.watch.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PanchangamWatch:
    build:
      targets:
        PanchangamWatch: all
        PanchangamWatchTests: [test]
    test:
      targets:
        - PanchangamWatchTests
