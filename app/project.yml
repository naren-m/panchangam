name: PanchangamMobile
options:
  bundleIdPrefix: app.panchangam
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  PanchangamShared:
    path: PanchangamShared
targets:
  Panchangam:
    type: application
    platform: iOS
    sources:
      - Panchangam/Sources
      - Panchangam/Assets.xcassets
    dependencies:
      - package: PanchangamShared
      - target: PanchangamWatch
        embed: true
    entitlements:
      path: Panchangam/Panchangam.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.panchangam
    info:
      path: Panchangam/Info.plist
      properties:
        CFBundleDisplayName: Panchangam
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Panchangam uses your location to calculate the current tithi for your watch complication.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.panchangam.Panchangam
  PanchangamWatch:
    type: application
    platform: watchOS
    sources:
      - PanchangamWatch/Sources
      - PanchangamWatch/Assets.xcassets
    dependencies:
      - package: PanchangamShared
      - target: PanchangamWatchWidget
        embed: true
    entitlements:
      path: PanchangamWatch/PanchangamWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.panchangam
    info:
      path: PanchangamWatch/Info.plist
      properties:
        CFBundleDisplayName: Panchangam Watch
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.panchangam.tithi
            CFBundleURLSchemes:
              - panchangam
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.panchangam.Panchangam
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.panchangam.Panchangam.watchkitapp
  PanchangamWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - PanchangamWatchWidget/Sources
    dependencies:
      - package: PanchangamShared
    entitlements:
      path: PanchangamWatchWidget/PanchangamWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.panchangam
    info:
      path: PanchangamWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Panchangam Tithi
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.panchangam.Panchangam.watchkitapp.widgets
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
schemes:
  Panchangam:
    build:
      targets:
        Panchangam: all
        PanchangamWatch: all
        PanchangamWatchWidget: all
    run:
      config: Debug
      executable: Panchangam
    archive:
      config: Release
    management:
      shared: true
      orderHint: 1
  PanchangamWatch:
    build:
      targets:
        PanchangamWatch: all
        PanchangamWatchWidget: all
    run:
      config: Debug
      executable: PanchangamWatch
    archive:
      config: Release
    management:
      shared: true
      orderHint: 2
